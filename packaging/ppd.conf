[main]
# The default PPD profile
default=balanced
battery_detection=true
# Follow /sys/firmware/acpi/platform_profile when it agrees with the saved
# base profile, or when no explicit user profile is active yet. This avoids a
# feedback loop between a desktop power-profile client and TuneD.
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
performance=throughput-performance

[battery]
# PPD = TuneD
balanced=balanced-battery
