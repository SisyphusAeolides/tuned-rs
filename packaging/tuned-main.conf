# Global tuned configuration file.

daemon = 1
dynamic_tuning = 0
sleep_interval = 1
update_interval = 10
# Bounded chaos analysis for telemetry and profile advice. It is enabled by
# default and never changes hardware controls on its own.
chaos_enabled = 1
chaos_window = 128
chaos_dt = 0.05
chaos_mandelbrot_iterations = 64
# Automatic profile changes require auto mode (`tuned-adm auto_profile`) and
# are protected by confirmation and minimum-dwell thresholds.
chaos_auto_profile = 1
chaos_confirmations = 3
chaos_min_dwell = 60
recommend_command = 1
reapply_sysctl = 1
default_instance_priority = 0
udev_buffer_size = 1MB
log_file_count = 2
log_file_max_size = 1MB
rollback = auto
profile_dirs = /usr/lib/tuned/profiles,/etc/tuned/profiles
startup_udev_settle_wait = 0
