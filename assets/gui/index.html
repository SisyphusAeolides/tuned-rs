<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TuneD Control Center</title>
<style>
:root{color-scheme:dark;--bg:#10141b;--card:#1a202b;--line:#303a4a;--text:#f4f7fb;--muted:#9daabd;--blue:#3b82f6;--green:#10b981;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#283449,var(--bg) 52%);color:var(--text);font:15px system-ui,sans-serif;min-height:100vh}.shell{max-width:1100px;margin:auto;padding:32px}.brand{display:flex;align-items:center;gap:18px;margin-bottom:28px}.brand img{width:82px;height:82px}.brand h1{margin:0;font-size:30px}.brand p{margin:5px 0;color:var(--muted)}.status{margin-left:auto;text-align:right}.pill{display:inline-block;padding:6px 12px;border-radius:999px;background:#16392f;color:#70e0b9}.metrics,.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.grid{grid-template-columns:repeat(3,1fr)}.card{background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 14px 40px #0004}.metric strong{font-size:28px;display:block;margin-top:7px}.metric span,label{color:var(--muted)}h2{font-size:18px;margin:0 0 16px}select,input,button{width:100%;border:1px solid var(--line);border-radius:10px;background:#111720;color:var(--text);padding:11px;margin:6px 0 13px}button{background:linear-gradient(135deg,var(--blue),#2563eb);border:0;font-weight:700;cursor:pointer;margin-top:10px}button:hover{filter:brightness(1.12)}#message{position:fixed;right:24px;bottom:24px;max-width:420px;padding:14px 18px;border-radius:12px;background:#243044;display:none}.danger{background:#4a2024}@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.status{display:none}}@media(max-width:480px){.shell{padding:18px}.metrics{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="brand"><img src="/icon.svg" alt="TuneD"><div><h1>TuneD Control Center</h1><p>Live profile, processor, network, and power control</p></div><div class="status"><span class="pill">Daemon online</span><p id="active">Loading…</p></div></header><section class="metrics"><div class="card metric"><span>CPU</span><strong id="cpu">—</strong></div><div class="card metric"><span>Memory</span><strong id="memory">—</strong></div><div class="card metric"><span>GPU</span><strong id="gpu">—</strong></div><div class="card metric"><span>Power</span><strong id="power">—</strong></div></section><section class="grid"><form class="card" id="profileForm"><h2>Power &amp; workload profile</h2><label for="profile">Active TuneD profile</label><select id="profile"></select><button>Apply profile</button></form><form class="card" id="cpuForm"><h2>Processor laboratory</h2><label for="cpuDevices">CPU selector</label><input id="cpuDevices" value="cpu*"><label for="governor">Governor</label><select id="governor"><option>performance</option><option>powersave</option><option>schedutil</option><option>ondemand</option><option>conservative</option></select><label for="epp">Energy preference</label><select id="epp"><option>performance</option><option>balance_performance</option><option>default</option><option>balance_power</option><option>power</option></select><button>Apply CPU tuning</button></form><form class="card" id="networkForm"><h2>Network laboratory</h2><label for="netDevices">Interface selector</label><input id="netDevices" value="*"><label for="mtu">MTU</label><input id="mtu" type="number" min="576" max="65535" value="1500"><label for="wol">Wake-on-LAN</label><select id="wol"><option value="d">Disabled</option><option value="g">Magic packet</option><option value="p">PHY activity</option><option value="u">Unicast</option></select><button>Apply network tuning</button></form></section></main><div id="message"></div><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';const headers={'Content-Type':'application/json','X-Tuned-Token':token};const $=id=>document.getElementById(id);function message(text,bad=false){const box=$('message');box.textContent=text;box.className=bad?'danger':'';box.style.display='block';setTimeout(()=>box.style.display='none',5000)}async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok||data.ok===false)throw new Error(data.message||'Request failed');return data}async function refresh(){try{const state=await api('/api/state');$('active').textContent='Active: '+state.active;$('cpu').textContent=state.telemetry.cpu_usage.toFixed(1)+'%';$('memory').textContent=state.telemetry.memory_usage.toFixed(1)+'%';$('gpu').textContent=state.telemetry.gpu_usage.toFixed(1)+'%';$('power').textContent=state.telemetry.power_consumption.toFixed(1)+' W';$('profile').innerHTML='';for(const [name,summary] of state.profiles){const option=document.createElement('option');option.value=name;option.textContent=summary?`${name} — ${summary}`:name;option.selected=name===state.active;$('profile').append(option)}}catch(error){message(error.message,true)}}async function submit(path,body){try{const result=await api(path,body);message(result.message||'Tuning applied');await refresh()}catch(error){message(error.message,true)}}$('profileForm').onsubmit=e=>{e.preventDefault();submit('/api/profile',{profile:$('profile').value})};$('cpuForm').onsubmit=e=>{e.preventDefault();submit('/api/cpu',{devices:$('cpuDevices').value,governor:$('governor').value,energy_performance_preference:$('epp').value})};$('networkForm').onsubmit=e=>{e.preventDefault();submit('/api/network',{devices:$('netDevices').value,mtu:Number($('mtu').value),wake_on_lan:$('wol').value})};refresh();setInterval(refresh,5000);
</script></body></html>
