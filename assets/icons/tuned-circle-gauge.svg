<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad1" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#323846"/>
      <stop offset="100%" stop-color="#12151C"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#C41212"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad1)" filter="url(#dropShadow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#CC2929" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Gauge Arc Background -->
  <path d="M 116 336 A 160 160 0 1 1 396 336" fill="none" stroke="#2A2F3D" stroke-width="28" stroke-linecap="round"/>

  <!-- Colored Gauge Arc -->
  <path d="M 116 336 A 160 160 0 1 1 396 336" fill="none" stroke="url(#arcGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Gauge Ticks -->
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.7">
    <line x1="136" y1="316" x2="152" y2="304" />
    <line x1="160" y1="216" x2="180" y2="220" />
    <line x1="256" y1="128" x2="256" y2="150" />
    <line x1="352" y1="216" x2="332" y2="220" />
    <line x1="376" y1="316" x2="360" y2="304" />
  </g>

  <!-- Center Hub -->
  <circle cx="256" cy="276" r="32" fill="#1E222D" stroke="#4B5563" stroke-width="6"/>

  <!-- Gauge Needle (pointing to Performance peak) -->
  <g transform="rotate(55 256 276)">
    <polygon points="252,276 260,276 257,140 255,140" fill="url(#redGrad)" />
    <circle cx="256" cy="276" r="12" fill="#FF4D4D"/>
  </g>

  <!-- Tuning Sliders Icon at Bottom -->
  <g transform="translate(186, 325) scale(0.7)" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <!-- Slider 1 -->
    <line x1="30" y1="10" x2="30" y2="70" stroke-opacity="0.4"/>
    <circle cx="30" cy="30" r="10" fill="#EF4444" stroke="none"/>
    <!-- Slider 2 -->
    <line x1="100" y1="10" x2="100" y2="70" stroke-opacity="0.4"/>
    <circle cx="100" cy="50" r="10" fill="#10B981" stroke="none"/>
    <!-- Slider 3 -->
    <line x1="170" y1="10" x2="170" y2="70" stroke-opacity="0.4"/>
    <circle cx="170" cy="25" r="10" fill="#3B82F6" stroke="none"/>
  </g>

  <!-- Text Branding -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">TuneD</text>
</svg>
