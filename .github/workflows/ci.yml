name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev pkg-config

      - name: Install Rust 1.75
        run: rustup toolchain install 1.75.0 --profile minimal --component clippy,rustfmt

      - name: Check TuneD replacement packaging
        run: make packaging-check

      - name: Check formatting
        run: cargo +1.75.0 fmt --all --check

      - name: Check workspace
        run: cargo +1.75.0 check --locked --all-targets

      - name: Lint workspace
        run: cargo +1.75.0 clippy --locked --all-targets -- -D warnings

      - name: Test workspace
        run: cargo +1.75.0 test --locked --all-targets

  formal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install formal toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends agda-bin chezscheme gfortran make

      - name: Build Idris2 from upstream source
        run: |
          set -euo pipefail
          idris_work=$(mktemp -d "$RUNNER_TEMP/idris2.XXXXXX")
          trap 'find "$idris_work" -depth -delete' EXIT
          git clone --filter=blob:none https://github.com/idris-lang/Idris2.git "$idris_work/src"
          git -C "$idris_work/src" checkout --detach 5aaefadb587224eb44d3be0fbb7e2835b48bd7a6
          make -C "$idris_work/src" bootstrap SCHEME=chezscheme PREFIX="$HOME/.local"
          make -C "$idris_work/src" install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check Fortran, Idris, and Agda models
        run: sh scripts/check-formal.sh --strict
